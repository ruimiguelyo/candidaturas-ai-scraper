<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<style>
  body {
    width: 360px; margin: 0; padding: 14px;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0b1120; color: #e2e8f0;
  }
  h1 { font-size: 15px; margin: 0 0 4px; color: #f8fafc; }
  .sub { font-size: 11.5px; color: #94a3b8; margin-bottom: 12px; }
  .card {
    background: #111a2e; border: 1px solid #24324f;
    border-radius: 10px; padding: 10px; margin-bottom: 10px;
  }
  label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 4px; font-weight: 600; text-transform: uppercase; }
  select, textarea {
    width: 100%; box-sizing: border-box; background: #17233c; color: #e2e8f0;
    border: 1px solid #24324f; border-radius: 7px; padding: 7px 8px; font-size: 12px; font-family: inherit;
  }
  .btn {
    width: 100%; border: none; border-radius: 8px; padding: 9px 12px;
    font-size: 12.5px; font-weight: 600; cursor: pointer; margin-bottom: 8px;
  }
  .btn-primary { background: linear-gradient(135deg, #2563eb, #4f46e5); color: #fff; }
  .btn-ghost { background: #17233c; color: #e2e8f0; border: 1px solid #24324f; }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .status { font-size: 12px; padding: 8px; border-radius: 7px; display: none; margin-top: 6px; }
  .status.ok { display: block; background: rgba(16,185,129,0.18); border: 1px solid rgba(16,185,129,0.45); color: #6ee7b7; }
  .status.err { display: block; background: rgba(239,68,68,0.18); border: 1px solid rgba(239,68,68,0.45); color: #fca5a5; }
</style>
</head>
<body>
  <h1>⚡ Estágio Radar Copilot</h1>
  <div class="sub" id="conn-state">A ligar a 127.0.0.1:8765...</div>

  <div class="card">
    <label for="cv-track">CV a Anexar nesta Candidatura</label>
    <select id="cv-track">
      <option value="ai_ml">Applied AI &amp; ML (PDF)</option>
      <option value="swe">Software Engineering Full-Stack (PDF)</option>
      <option value="enterprise">Enterprise Systems + AI (PDF)</option>
    </select>
  </div>

  <button class="btn btn-primary" id="btn-autofill">⚡ Auto-Preencher + Anexar CV nesta Página</button>
  <button class="btn btn-ghost" id="btn-copy-note">✨ Gerar &amp; Copiar Nota para Esta Vaga</button>

  <div class="card" id="note-card" style="display:none">
    <label for="gen-note">Nota Gerada (pronta a colar)</label>
    <textarea id="gen-note" rows="5"></textarea>
    <button class="btn btn-ghost" id="btn-copy-dm" style="margin-top:6px;margin-bottom:0">💬 Copiar DM Recrutador</button>
  </div>

  <div class="status" id="status-box"></div>
  <script src="popup.js"></script>
</body>
</html>
