name: Estágio Radar PT v4.0 (Sniper + Deep)

on:
  schedule:
    # Fast (ATS diretos + EU Trackers + LinkedIn 24h) a cada 30 minutos durante o dia PT
    - cron: "*/30 7-21 * * 1-5"
    # Deep sweep completo nos horários-chave (dias úteis e fim de semana)
    - cron: "5 8,13,18 * * 1-5"
    - cron: "5 10,15,20 * * 0,6"
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo do scan (sniper, fast ou full)"
        required: false
        default: "full"

concurrency:
  group: estagio-radar-pt
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  radar-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -e ".[dev]"

      - name: Restaurar estado SQLite e cache Teamlyzer
        uses: actions/cache/restore@v4
        with:
          path: |
            data/radar.db
            data/company_cache.json
          key: estagio-radar-v4-state-${{ github.run_id }}
          restore-keys: |
            estagio-radar-v4-state-

      - name: Escolher modo conforme cron
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode || 'full' }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "5 8,13,18 * * 1-5" ] || [ "${{ github.event.schedule }}" = "5 10,15,20 * * 0,6" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=fast" >> "$GITHUB_OUTPUT"
          fi

      - name: Executar Radar (com baseline inicial em cold-cache)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RADAR_RUNNER_LABEL: "GitHub 24/7"
        run: |
          if [ ! -f data/radar.db ]; then
            echo "Cold cache detetado: a criar baseline inicial sem spam..."
            python -m estagio_radar scan --mode full
            python -m estagio_radar mark-notified
          else
            python -m estagio_radar scan --mode "${{ steps.pick.outputs.mode }}" --notify
          fi
          if [ -f data/radar.db ]; then
            python -c "import sqlite3; c=sqlite3.connect('data/radar.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE);'); c.close()"
          fi

      - name: Guardar estado SQLite e cache Teamlyzer na cache do Actions
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/radar.db
            data/company_cache.json
          key: estagio-radar-v4-state-${{ github.run_id }}

      - name: Publicar dashboard e ficheiros CSV/JSON como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estagio-radar-output
          path: output/
          retention-days: 7
