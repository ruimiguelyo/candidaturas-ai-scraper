name: Daily AI Job Scraper

on:
  schedule:
    # 09:00 UTC corresponde a 09:00 no inverno e 10:00 no verão em Lisboa.
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: daily-ai-job-scraper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape-and-notify:
    name: Scrape, validate and notify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked direct dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Validate business and safety rules
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Prepare private candidate profile
        env:
          CANDIDATE_PROFILE_JSON: ${{ secrets.CANDIDATE_PROFILE_JSON }}
        run: >-
          python -c "import os, pathlib; profile=os.getenv('CANDIDATE_PROFILE_JSON');
          profile and pathlib.Path('candidate_profile.local.json').write_text(profile, encoding='utf-8')"

      - name: Run healthy pipeline and require email delivery
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          HIRING_INTELLIGENCE_ENABLED: "true"
          MAX_HIRING_LOOKUPS: "10"
        run: python main.py --notify

      - name: Stage validated public artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-public-job-data
          if-no-files-found: error
          retention-days: 1
          path: |
            company_scores_cache.json
            vagas_estritamente_junior_trainee_internship.csv
            vagas_estritamente_junior_trainee_internship.json
            vagas_rejeitadas.csv

  publish:
    name: Publish validated public data
    needs: scrape-and-notify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout with narrowly scoped publish credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download validated artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-public-job-data
          path: .

      - name: Commit and push public data only
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -- company_scores_cache.json vagas_estritamente_junior_trainee_internship.csv vagas_estritamente_junior_trainee_internship.json vagas_rejeitadas.csv
          if git diff --cached --quiet; then
            echo "Sem alterações para publicar."
          else
            git commit -m "Auto: Atualizacao diaria de vagas IA [$(date +'%Y-%m-%d')]"
            git push
          fi
