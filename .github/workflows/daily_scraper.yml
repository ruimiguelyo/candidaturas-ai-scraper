name: Daily AI Job Scraper

on:
  schedule:
    # Executa todos os dias às 09:00 UTC (10:00 Lisboa)
    - cron: '0 9 * * *'
  workflow_dispatch: # Permite correr manualmente com 1 clique no GitHub

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Agregador de Vagas e Enviar Email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: |
          python main.py

      - name: Commit e Push dos Novos Resultados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add vagas_estritamente_junior_trainee_internship.csv vagas_estritamente_junior_trainee_internship.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Atualizacao diaria de vagas IA [$(date +'%Y-%m-%d')]" && git push)
