[project]
name = "candidaturas-ai-scraper"
version = "2.0.0"
description = "Deterministic job discovery and triage for entry-level AI and software roles"
requires-python = ">=3.10,<3.13"
dependencies = [
  "beautifulsoup4==4.14.3",
  "curl-cffi==0.16.0",
  "ddgs==9.15.0",
  "httpx==0.28.1",
  "pydantic==2.12.5",
  "rich==14.2.0",
]

[project.scripts]
candidaturas = "main:main"

[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
  "company_ranker",
  "email_notifier",
  "exporter",
  "filter_engine",
  "hiring_intelligence",
  "main",
  "models",
]

[tool.setuptools.packages.find]
include = ["scrapers*"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
