[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "estagio-radar-pt"
version = "4.0.0"
description = "Radar de alta precisão para estágios e oportunidades entry-level de Informática, IA e Software Engineering em Portugal (Setúbal, Lisboa e Remoto)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0,<1.0",
    "curl-cffi>=0.7.0,<1.0",
    "beautifulsoup4>=4.12.3,<5.0",
    "lxml>=5.2.0,<6.0",
    "pydantic>=2.6.0,<3.0",
    "pyyaml>=6.0.1,<7.0",
    "rich>=13.7.0,<14.0",
    "python-dotenv>=1.0.1,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0",
    "pytest-asyncio>=0.23.0,<1.0",
]
apply = [
    "playwright>=1.48.0,<2.0",
]

[project.scripts]
estagio-radar = "estagio_radar.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
